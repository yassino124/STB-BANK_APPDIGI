# ─────────────────────────────────────────────────────────────────────────────
#  STB Enterprise Banking System - Docker Compose
#  Services: MongoDB | NestJS Backend | React Dashboard
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: stb_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-stb_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-stb_secure_pass_2024}
      MONGO_INITDB_DATABASE: stb_db
    ports:
      - "27017:27017"
    volumes:
      - stb_mongo_data:/data/db
      - stb_mongo_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - stb_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Redis (Caching & Queues) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stb_redis_data:/data
    networks:
      - stb_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./stb-backend
      dockerfile: Dockerfile
      target: production
    container_name: stb_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-stb_admin}:${MONGO_ROOT_PASS:-stb_secure_pass_2024}@mongodb:27017/stb_db?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-stb_access_super_secret_key_2024_enterprise}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-stb_refresh_super_secret_key_2024_enterprise}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-30d}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-"STB RH Digi <noreply@stb.com.tn>"}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stb_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── React Dashboard (Nginx) ──────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard_web_stb
      dockerfile: Dockerfile
      target: production
    container_name: stb_dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stb_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Mongo Express (Admin UI - Dev only) ─────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: stb_mongo_express
    restart: unless-stopped
    profiles: ["dev"]   # Only started with: docker compose --profile dev up
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-stb_admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASS:-stb_secure_pass_2024}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-stb_admin}:${MONGO_ROOT_PASS:-stb_secure_pass_2024}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-admin123}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stb_network

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  stb_network:
    driver: bridge
    name: stb_enterprise_network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  stb_mongo_data:
    name: stb_mongo_data
  stb_mongo_config:
    name: stb_mongo_config
  stb_redis_data:
    name: stb_redis_data
