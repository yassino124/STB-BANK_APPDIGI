name: 🌐 STB Web Dashboard — CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dashboard_web_stb/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dashboard_web_stb/**'

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: 🏗️ Build & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard_web_stb/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: dashboard_web_stb

      - name: 🏗️ Build production bundle
        run: npm run build
        working-directory: dashboard_web_stb
        env:
          VITE_API_URL: https://stb-backend-lu64.onrender.com/api/v1

      - name: 📊 Bundle size report
        run: |
          echo "=== Bundle Sizes ==="
          du -sh dashboard_web_stb/dist/assets/*.js 2>/dev/null | head -10 || true
          echo "Total dist size: $(du -sh dashboard_web_stb/dist | cut -f1)"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dashboard-build-${{ github.run_number }}
          path: dashboard_web_stb/dist
          retention-days: 14
