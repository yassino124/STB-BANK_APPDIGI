name: 📱 STB Mobile — Build & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/flutter-deploy.yml'
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Static Analysis + Tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Flutter Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code (static analysis)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 🧪 Run tests
        run: flutter test --coverage
        continue-on-error: true

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Android APK (Debug — pour démonstration)
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK (Debug)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build Debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stb-debug-${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: ✅ Build Summary
        run: |
          echo "✅ BUILD SUCCESS"
          echo "📱 STB Mobile Build #${{ github.run_number }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "📦 APK size: $(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"
