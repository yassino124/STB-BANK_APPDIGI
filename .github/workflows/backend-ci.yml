name: 🏦 STB Backend — CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'stb-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'stb-backend/**'

env:
  NODE_VERSION: '20'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint + Unit Tests + Coverage
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: stb-backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: stb-backend

      - name: 🧪 Run unit tests with coverage
        run: npm run test:cov
        working-directory: stb-backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/stb_test
          JWT_ACCESS_SECRET: ci_test_access_secret_key_32chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_32chars
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 30d
          THROTTLE_TTL: 60
          THROTTLE_LIMIT: 1000

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_number }}
          path: stb-backend/coverage
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Security Scan
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: stb-backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: stb-backend

      - name: 🔎 Audit npm dependencies (high severity)
        run: npm audit --audit-level=high
        working-directory: stb-backend
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Trigger Render Deploy via webhook
  # ────────────────────────────────────────────────────────────────────────────
  deploy-render:
    name: 🚀 Trigger Render Deploy
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Trigger Render redeploy via API
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{"clearCache":"do_not_clear"}'
          echo "✅ Render deploy triggered for commit ${{ github.sha }}"
