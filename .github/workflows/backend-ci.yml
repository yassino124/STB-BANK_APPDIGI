name: 🏦 STB Backend — CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'stb-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'stb-backend/**'

env:
  NODE_VERSION: '20'
  IMAGE_NAME: stb-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint + Unit Tests + Coverage
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: stb-backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: stb-backend

      - name: 🔍 Lint code
        run: npm run lint
        working-directory: stb-backend

      - name: 🧪 Run unit tests with coverage
        run: npm run test:cov
        working-directory: stb-backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/stb_test
          JWT_ACCESS_SECRET: ci_test_access_secret_key_32chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_32chars
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 30d
          THROTTLE_TTL: 60
          THROTTLE_LIMIT: 1000

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_number }}
          path: stb-backend/coverage
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Security Scan
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: stb-backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: stb-backend

      - name: 🔎 Audit npm dependencies (high severity)
        run: npm audit --audit-level=high
        working-directory: stb-backend
        continue-on-error: true  # ne bloque pas le build, mais affiche le rapport

      - name: 🔑 Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./stb-backend/src
          base: main
          head: HEAD
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build Docker Image (seulement sur main)
  # ────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: 🐳 Build & Push Docker Image
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: 🏗️ Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./stb-backend
          dockerfile: ./stb-backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Staging
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_HOST }}:3000

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 SSH Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            echo "📦 Pulling latest images..."
            cd /opt/stb-banking
            docker compose pull backend
            
            echo "🚀 Starting services..."
            docker compose up -d --no-deps backend
            
            echo "⏳ Waiting for health check..."
            sleep 15
            docker compose ps
            
            echo "✅ Health check..."
            curl -f http://localhost:3000/api/v1/health || exit 1
            
            echo "🎉 Deployment successful! Build: ${{ github.sha }}"
